[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chtorch"
version = "0.0.1"
description = "Utility packages for making pytorch models for climate and health"
readme = "README.rst"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Knut Rand", email = "knutdrand@gmail.com"},
]
keywords = ["chtorch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer",
    "chap-core @ git+https://github.com/dhis2-chap/chap-core.git",
    "torch",
    "lightning",
    "pytorch_forecasting",
    "optuna",
    "numpydantic",
    "chapkit",
    "uvicorn[standard]",
    "fastapi<=0.120.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=3",
    "hypothesis",
    "ipython>=9.8.0",
]

#[tool.uv.sources]
#chapkit = { git = "https://github.com/dhis2-chap/chapkit" }

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/knutdrand/chtorch"
Repository = "https://github.com/knutdrand/chtorch"

[project.scripts]
chtorch = "chtorch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chtorch"]
